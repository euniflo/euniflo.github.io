<!DOCTYPE html>
<html>

<head>
  <title>My Profile</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    /* TOP NAVIGATION BAR */
    nav {
      background-color: #2c3e50;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    nav a:hover {
      color: white;
    }

    /* MAIN CARD */
    .container {
      width: 650px;
      margin: 60px auto;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
    }

    /* TOP BANNER */
    .banner {
      background-color: #2c3e50;
      height: 100px;
    }

    /* PROFILE CONTENT */
    .profile {
      padding: 20px 40px 40px;
      text-align: center;
    }

    .profile h1 {
      font-size: 26px;
      color: #222222;
      margin-bottom: 6px;
    }

    .profile .title {
      color: #888888;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .profile p {
      color: #555555;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    /* SKILLS TAGS */
    .skills {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .tag {
      background-color: #eaf3fb;
      color: #2980b9;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* BUTTON */
    .btn {
      background-color: #2c3e50;
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 15px;
    }

    .btn:hover {
      background-color: #3d5166;
    }

  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav>
    <span class="logo">MyWebsite</span>
    <div>
      <a href="#">Home</a>
      <a href="about.html">About</a>

    </div>
  </nav>

  <!-- PROFILE CARD -->

<div class="banner"></div>

      <p>

        <span class="tag">HTML</span>

        <span class="tag">Abu Dhabi</span>
      </div>

      <a class="btn" href="ewamahia@gmail.com">Contact Me</a>

  </div>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <title>My Website</title>
  <style>

    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      background-color: white;
      width: 600px;
      margin: 60px auto;
      padding: 40px;
      border-radius: 12px;
    }

    h1 {
      color: #222222;
    }

    h2 {
      color: #444444;
    }

    p {
      color: #666666;
      line-height: 1.8;
    }

    a {
      color: #3498db;
    }

    img {
      border-radius: 8px;
    }

    ul {
      color: #666666;
      line-height: 2;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>This is Heading 1 (Biggest)</h1>
    <h2>This is Heading 2</h2>
    <h3>This is Heading 3 (Smaller)</h3>

    <p>This is a paragraph. I am learning HTML and this is my first website!</p>

    <p>This word is <b>bold</b> and this word is <i>italic</i>.</p>

    <p>Visit <a href="https://www.google.com">Google</a></p>

    <img src="https://picsum.photos/300/200" alt="A random image">

    <h2>My Hobbies</h2>
    <ul>
      <li>Reading</li>
      <li>Coding</li>
      <li>Gaming</li>
    </ul>

  </div>

</body>

</html>
